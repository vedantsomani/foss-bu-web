<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fragline netcode lab</title>
<style>
  :root { color-scheme: dark; --bg:#0d0f12; --panel:#161a20e6; --line:#2a313b; --fg:#d8dee6; --dim:#8a96a6; --acc:#ff9d2e; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.35 ui-monospace,Menlo,Consolas,monospace; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #vm { pointer-events:none; }
  #panel { position:absolute; top:10px; left:10px; width:270px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; backdrop-filter:blur(4px); }
  #panel h1 { font-size:13px; margin:0 0 6px; color:var(--acc); letter-spacing:.04em; }
  #panel label { display:grid; grid-template-columns:96px 1fr 44px; align-items:center; gap:6px; margin:3px 0; color:var(--dim); }
  #panel output { text-align:right; color:var(--fg); }
  #panel .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; color:var(--dim); }
  #stats { white-space:pre; margin-top:8px; color:var(--fg); font-size:12px; }
  #help { position:absolute; right:10px; top:10px; max-width:260px; color:var(--dim); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  #help b { color:var(--fg); }
  @media (max-width:700px){ #help{display:none} #panel{width:auto;right:10px} }
</style>
</head>
<body>
<canvas id="map"></canvas>
<canvas id="vm"></canvas>
<div id="panel">
  <h1>NETCODE LAB (in-memory link)</h1>
  <label>Latency (1-way)<input id="lat" type="range" min="0" max="300" step="5" value="75"><output id="latO">75 ms</output></label>
  <label>Jitter<input id="jit" type="range" min="0" max="80" step="1" value="10"><output id="jitO">10 ms</output></label>
  <label>Packet loss<input id="loss" type="range" min="0" max="40" step="1" value="5"><output id="lossO">5 %</output></label>
  <div class="row">
    <label style="display:flex;gap:4px;margin:0"><input id="showAuth" type="checkbox" checked> authoritative</label>
    <label style="display:flex;gap:4px;margin:0"><input id="showBots" type="checkbox" checked> bots</label>
  </div>
  <div id="stats">loading WAD...</div>
</div>
<div id="help"><b>WASD</b> move &nbsp; <b>Shift</b> sprint &nbsp; <b>Space</b> jump<br><b>Mouse</b> aim (cursor) &nbsp; <b>Click</b> fire &nbsp; <b>1-7</b> weapon<br><b>Wheel</b> zoom<br>
filled disc = your <i>predicted</i> position, white ring = host-<i>authoritative</i>, discs of other colours = interpolated remote players.</div>
<script type="module" src="play.js"></script>
</body>
</html>
